# CI on remediation / feature PRs — system of record before merge
#
# Interview beat: OpenFix opens the fix PR → these Checks run → human merges.
# Agents do not self-attest. Jobs below mirror a typical enterprise PR gate
# (unit + SAST + SCA + secrets + CodeQL). Scanner jobs are stubs that always
# pass; replace with real Semgrep/OSV/Gitleaks/CodeQL in production.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Unit tests

          Regression / smoke tests on the fix branch.
          OpenFix agents propose patches; this job proves the app still works.
          EOF

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Semgrep on fix PR
        run: |
          echo "Simulated: semgrep ci --config=auto (detective control on remediation PR)"
          echo "Production: fail if original rule/fingerprint still fires in fresh SARIF."
          sleep 2
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Semgrep SAST

          Deterministic SAST re-run on the **fix PR** (not agent prose).
          Prototype stub — wire real Semgrep and gate on cleared findings.
          EOF

  dependency-sca:
    name: OSV Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate OSV / SCA on lockfile
        run: |
          echo "Simulated: osv-scanner -r . (SCA detective control)"
          echo "Production: fail on newly introduced or unfixed CVEs vs baseline."
          sleep 2
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## OSV Dependency scan

          SCA re-check after dependency bumps from OpenFix agents.
          Prototype stub — replace with osv-scanner / Snyk / Dependabot gates.
          EOF

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate gitleaks / secret scan
        run: |
          echo "Simulated: gitleaks detect --source . (no new secrets on fix PR)"
          sleep 1
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Secret scanning

          Block accidental credential commits on remediation branches.
          OpenFix policy already keeps secret findings `human_only`.
          EOF

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate CodeQL analyze
        run: |
          echo "Simulated: github/codeql-action analyze (JS)"
          echo "Production: upload SARIF; require clean vs baseline for merge."
          sleep 2
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CodeQL

          GitHub-native SAST as a second detective control beside Semgrep.
          Prototype stub — enable CodeQL workflow for real queries.
          EOF
