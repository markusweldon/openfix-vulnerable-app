# CI on remediation / feature PRs — system of record before merge
#
# Interview beat: OpenFix opens the fix PR → these Checks run → human merges.
# Agents do not self-attest. One job = one GitHub-hosted runner slot (free-tier
# concurrency). Steps still mirror an enterprise PR gate (unit + SAST + SCA +
# secrets + CodeQL). Scanner steps are stubs; replace with real tools.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PR gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Semgrep SAST
        run: |
          echo "Simulated: semgrep ci --config=auto (detective control on remediation PR)"
          echo "Production: fail if original rule/fingerprint still fires in fresh SARIF."

      - name: OSV Dependency scan
        run: |
          echo "Simulated: osv-scanner -r . (SCA detective control)"
          echo "Production: fail on newly introduced or unfixed CVEs vs baseline."

      - name: Secret scanning
        run: |
          echo "Simulated: gitleaks detect --source . (no new secrets on fix PR)"

      - name: CodeQL
        run: |
          echo "Simulated: github/codeql-action analyze (JS)"
          echo "Production: upload SARIF; require clean vs baseline for merge."

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## PR gates (before merge)

          | Gate | Role |
          | --- | --- |
          | Unit tests | App still works after the fix |
          | Semgrep SAST | Deterministic SAST on the fix PR |
          | OSV Dependency scan | SCA after dependency bumps |
          | Secret scanning | No accidental credentials |
          | CodeQL | Second SAST control |

          OpenFix agents propose patches; this workflow is the system of record before merge.
          Scanner steps are stubs in the interview prototype — swap in real tools for production.
          EOF
