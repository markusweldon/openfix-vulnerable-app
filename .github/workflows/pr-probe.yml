# Minimal probe — delete after CI triggers are confirmed healthy
name: PR probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'chore/**', 'cursor/**']
  workflow_dispatch:

jobs:
  ping:
    name: Probe ping
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR/push trigger OK at $(date -u)"
